name: Build Windows

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CMAKE_GENERATOR: "Visual Studio 17 2022"

jobs:
  build:
    name: Build (x64 Release)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure DX11 (CMake)
        run: cmake -B build_dx11 -A x64 -DCMAKE_BUILD_TYPE=Release -DREVIANGLE_BACKEND_D3D11=ON -DREVIANGLE_BACKEND_VULKAN=OFF

      - name: Build DX11
        run: cmake --build build_dx11 --config Release --parallel

      - name: Configure Vulkan (CMake)
        run: cmake -B build_vulkan -A x64 -DCMAKE_BUILD_TYPE=Release -DREVIANGLE_BACKEND_D3D11=OFF -DREVIANGLE_BACKEND_VULKAN=ON

      - name: Build Vulkan
        run: cmake --build build_vulkan --config Release --parallel

      - name: Run INI round-trip test
        run: ./build_dx11/Release/ini_round_trip_test.exe examples_config/angle_config.default-safe.ini
        shell: pwsh

      - name: Stage release artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/dx11 | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/vulkan | Out-Null

          # DX11
          Copy-Item build_dx11/Release/opengl32.dll             artifacts/dx11/
          Copy-Item build_dx11/Release/gd-angle-editor.exe      artifacts/dx11/
          Copy-Item build_dx11/Release/ReviANGLE-Uninstall.exe  artifacts/dx11/
          Copy-Item examples_config/angle_config.default-safe.ini artifacts/dx11/angle_config.ini
          Copy-Item LICENSE                                     artifacts/dx11/

          # Vulkan
          Copy-Item build_vulkan/Release/opengl32.dll           artifacts/vulkan/
          Copy-Item build_vulkan/Release/gd-angle-editor.exe    artifacts/vulkan/
          Copy-Item build_vulkan/Release/ReviANGLE-Uninstall.exe artifacts/vulkan/
          Copy-Item examples_config/angle_config.default-safe.ini artifacts/vulkan/angle_config.ini
          Copy-Item LICENSE                                     artifacts/vulkan/

          Get-ChildItem artifacts -Recurse | Format-Table Name, Length
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReviANGLE-build-${{ github.sha }}
          path: artifacts/
          retention-days: 30

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: pwsh
        run: |
          $payload = @{
            username   = "ReviANGLE CI"
            avatar_url = "https://github.com/Reviusion.png"
            embeds = @(@{
              title       = "❌ Build failed: $env:GITHUB_WORKFLOW"
              description = "**Job:** Build (x64 Release)`n**Repo:** $env:GITHUB_REPOSITORY`n**Ref:** ``$env:GITHUB_REF_NAME```n**Commit:** ``$($env:GITHUB_SHA.Substring(0,7))``  by **$env:GITHUB_ACTOR**"
              url         = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
              color       = 15158332
              footer      = @{ text = "Discord reviusion" }
              timestamp   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            })
          } | ConvertTo-Json -Depth 6 -Compress
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload

  release:
    name: Publish GitHub Release
    runs-on: windows-2022
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ReviANGLE-build-${{ github.sha }}
          path: release/

      - name: Package release ZIP
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path release/dx11/* -DestinationPath "ReviANGLE-$version-DX11-win64.zip" -Force
          Compress-Archive -Path release/vulkan/* -DestinationPath "ReviANGLE-$version-Vulkan-win64.zip" -Force
          Get-Item "ReviANGLE-$version-DX11-win64.zip" | Select Name, Length
          Get-Item "ReviANGLE-$version-Vulkan-win64.zip" | Select Name, Length
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ReviANGLE-${{ github.ref_name }}-DX11-win64.zip
            ReviANGLE-${{ github.ref_name }}-Vulkan-win64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          name: ReviANGLE ${{ github.ref_name }}
          body: |
            ## ReviANGLE ${{ github.ref_name }}

            **Active Fork** with simultaneous DirectX 11 and Vulkan backend support, plus enhanced DirectX 11 backend.
            
            Maintained at [@nazarhktwitch/ReviANGLE](https://github.com/nazarhktwitch/ReviANGLE).
            Original project: [@Reviusion/ReviANGLE](https://github.com/Reviusion/ReviANGLE) (v2.x series).

            ---

            ### Version History Note

            This fork continues from **Reviusion/ReviANGLE v3.0.0** with versions 3.x indicating active fork maintenance.
            The original project used v2.x versioning — this fork's v3.x (3.0.0 and above) represents:
            - **Vulkan backend** — Full OpenGL→Vulkan translation via ANGLE
            - **Enhanced DirectX 11** — Performance improvements to existing DX11 code
            - **Modern installer/uninstaller** — GUI-based tools for deployment

            See [CHANGELOG.md](CHANGELOG.md) for detailed upgrade notes.

            ---

            ### What's New
            See [CHANGELOG.md](CHANGELOG.md#${{ github.ref_name }}) and commit history for this release.

            ### Downloads

            Two separate builds available (choose one):

            | Build | Backend | Best For | Notes |
            |-------|---------|----------|-------|
            | **DX11-win64** | DirectX 11 | All hardware | Most stable, works on older GPUs |
            | **Vulkan-win64** | Vulkan | RTX, Radeon RX, Intel Arc | Modern GPUs, best performance |

            ### Installation

            1. Download the ZIP for your GPU
            2. Extract into your Geometry Dash folder (where `GeometryDash.exe` is)
            3. Run GD or use `gd-angle-editor.exe` to configure

            See [`docs/INSTALLATION.md`](docs/INSTALLATION.md) for detailed instructions.

            ### Support

            - Questions? See [`docs/INSTALLATION.md`](docs/INSTALLATION.md) or [`docs/STABILITY_GUIDE.md`](docs/STABILITY_GUIDE.md)
            - Found a bug? Check [issues](https://github.com/nazarhktwitch/ReviANGLE/issues)

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: pwsh
        run: |
          $payload = @{
            username   = "ReviANGLE CI"
            avatar_url = "https://github.com/Reviusion.png"
            embeds = @(@{
              title       = "❌ Release failed: $env:GITHUB_WORKFLOW"
              description = "**Job:** Publish GitHub Release`n**Repo:** $env:GITHUB_REPOSITORY`n**Tag:** ``$env:GITHUB_REF_NAME```n**Commit:** ``$($env:GITHUB_SHA.Substring(0,7))``  by **$env:GITHUB_ACTOR**"
              url         = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
              color       = 15158332
              footer      = @{ text = "Discord reviusion" }
              timestamp   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            })
          } | ConvertTo-Json -Depth 6 -Compress
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
